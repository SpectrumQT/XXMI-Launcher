[error_migoto_game_detection_timeout]
src = """
Game process `{process_name}` did not start within **{start_timeout}**s.

If game window takes longer to appear, adjust **{game_process_wait_timeout_label}** in **General Settings**.

If game crashed, try to follow the [Crash Isolation Checklist]({checklist_link}).
"""
loc = """
El proceso del juego `{process_name}` no se inició en **{start_timeout}** s.

Si la ventana del juego tarda más en aparecer, ajusta **{game_process_wait_timeout_label}** en **Configuración general**.

Si el juego se bloqueó, sigue la [lista de verificación para diagnosticar el fallo]({checklist_link}).
"""

