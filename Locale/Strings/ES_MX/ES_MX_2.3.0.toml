[general_settings_game_launch_tooltip]
src = """
Choose what the **{launcher_start_button}** button does.

* **{general_settings_launch_direct}:** Launch the game directly from the detected or configured game folder.
* **{general_settings_launch_steam}:** Launch the game through Steam to enable Steam Overlay and playtime tracking.
* **{general_settings_launch_epic}:** Launch the game through Epic Games to enable Epic Games overlay and tracking.
* **{general_settings_launch_custom}:** Run a custom Windows command to launch the game.
* **{general_settings_launch_manual}:** Wait for you to launch the game manually.
"""
loc = """
Elige qué hace el botón **{launcher_start_button}**.

* **{general_settings_launch_direct}:** Inicia el juego directamente desde la carpeta del juego detectada o configurada.
* **{general_settings_launch_steam}:** Inicia el juego mediante Steam para habilitar Steam Overlay y el registro del tiempo de juego.
* **{general_settings_launch_epic}:** Inicia el juego mediante Epic Games para habilitar la superposición y el registro de Epic Games.
* **{general_settings_launch_custom}:** Ejecuta un comando personalizado de Windows para iniciar el juego.
* **{general_settings_launch_manual}:** Espera a que inicies el juego manualmente.
"""

