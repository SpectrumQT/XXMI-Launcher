[importer_settings_inject_mode_label]
src = "XXMI DLL Injection Mode"
loc = "Modo de inyección de DLL de XXMI"

[advanced_settings_custom_launch_inject_mode_option_menu_tooltip]
src = """
Defines the way of **XXMI DLL** injection into the game process.

* **{general_settings_inject_mode_direct}:** Use `WriteProcessMemory`, more reliable but requires direct memory access.
* **{general_settings_inject_mode_hook}:** Use `SetWindowsHookEx`, less reliable, but potentially less prominent for anti-cheats.
* **{general_settings_inject_mode_skip}:** Skip **XXMI DLL** injection.
"""
loc = """
Define la forma de inyección de **DLL de XXMI** en el proceso del juego.

* **{general_settings_inject_mode_direct}:** Utiliza `WriteProcessMemory`, más fiable, pero requiere acceso directo a la memoria.
* **{general_settings_inject_mode_hook}:** Utiliza `SetWindowsHookEx`, menos fiable, pero potencialmente menos visible para los anticheats.
* **{general_settings_inject_mode_skip}:** Omite la inyección de **DLL de XXMI**.
"""

