**{importer}** requiere **DirectX 11** para funcionar.

Una vez que se abra el **launcher oficial**, asegúrate de **activar la casilla del modo DirectX 11** en la **esquina inferior derecha** de la ventana del launcher.
"""

[message_title_resource_tier_selection]
src = "Select Resource Quality"
loc = "Seleccionar calidad de recursos"

[message_text_resource_tier_selection]
src = """
**{game}** requires **[Resource Quality]({page_link})** to be selected to avoid game crash on loading.

For **Steam** and **Epic Games** installations select **{default_tier}**.

For **official launcher** installation select **any actually downloaded** tier (default is usually **{default_tier}**):

{radio_widget}

You can also change it later with **{general_settings_wuwa_resource_tier_label}** in **General Settings**.
"""
loc = """
**{game}** requiere que se seleccione **[Calidad de recursos]({page_link})** para evitar que el juego se cierre inesperadamente durante la carga.

Para las instalaciones de **Steam** y **Epic Games**, selecciona **{default_tier}**.

Para la instalación mediante el **launcher oficial**, selecciona cualquier nivel que **realmente hayas descargado** (normalmente, el predeterminado es **{default_tier}**):

{radio_widget}

También puedes cambiarlo más adelante desde **{general_settings_wuwa_resource_tier_label}** en **Ajustes generales**.
"""

[general_settings_wuwa_resource_tier_label]
src = "Client Resource Quality"
loc = "Calidad de recursos del cliente"

[general_settings_wuwa_resource_tier_tooltip]
src = """
Controls **[assets quality tier]({page_link})** used by **{game}**.

* For **Steam** and **Epic Games** installations select **{default_tier}**.
* For **official launcher** installation select **any actually downloaded** tier.

Selection of wrong tier will cause the game to crash on loading.
"""
loc = """
Controla el nivel de **[calidad de los recursos]({page_link})** utilizado por **{game}**.

* Para las instalaciones de **Steam** y **Epic Games**, selecciona **{default_tier}**.
* Para la instalación mediante el **launcher oficial**, selecciona cualquier nivel que **realmente hayas descargado**.

Seleccionar un nivel incorrecto hará que el juego se cierre inesperadamente durante la carga.
"""
