[launcher_frame_animation_info_tooltip]
src = """
Displays animated background FPS information.

* `Render`: FPS of GUI drawing engine.
    - Affected by the launcher window size.
* `Decoder`: FPS of video decoding stream.
    - Affected by the source video resolution and format.
    - Capped at `60`, since GUI render can't go faster on modern CPUs.
* `Source`: FPS of the video file itself.
"""
loc = """
Muestra información de FPS del fondo animado.

* `Render`: FPS del motor de renderizado de la interfaz gráfica.
    - Depende del tamaño de la ventana del launcher.
* `Decoder`: FPS de decodificación del flujo de video.
    - Depende de la resolución y el formato del video de origen.
    - Está limitado a `60`, ya que el renderizado de la interfaz gráfica no puede ir más rápido en los procesadores modernos.
* `Source`: FPS del archivo de video.
"""

