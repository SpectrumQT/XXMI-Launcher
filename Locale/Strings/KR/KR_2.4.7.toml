창 배율을 백분율로 설정합니다.

* `100`%는 런처의 기본 해상도인 **1280x720**에 해당합니다.
* 창 배율은 최소 `50`%부터 모니터 해상도에 따른 최대값까지 설정할 수 있습니다.
"""

[launcher_settings_dev_mode_checkbox_tooltip]
src = """
Enables utilities for theme development.

* **Hot reload:** Automatically detect changes to `custom-tkinter-theme.json` and apply them.
* **FPS counter:** Display animated background FPS information at the bottom of the main window.
"""
loc = """
테마 개발용 도구를 활성화합니다.

* **핫 리로드:** `custom-tkinter-theme.json`의 변경 사항을 자동으로 감지하고 적용합니다.
