[launcher_settings_auto_close_checkbox_tooltip]
src = """
Choose what the launcher should do after the game starts and XXMI DLL injection is confirmed.

* **Enabled:** Automatically close the launcher.
* **Disabled:** Keep the launcher running.
"""
loc = """
게임이 시작되고 XXMI DLL 주입이 확인된 후 런처가 수행할 작업을 선택합니다.

* **활성화:** 런처를 자동으로 종료합니다.
* **비활성화:** 런처를 계속 실행 상태로 유지합니다.
"""

[launcher_settings_theme_option_menu_tooltip]
src = """
Select a launcher GUI theme.

> The `Default` theme will be **overwritten by launcher updates**! Create a copy if you want to customize it.

To create a custom theme:

1. Duplicate the `Default` folder inside the `Themes` folder.
2. Rename the duplicate to the name you want displayed here.
3. Edit or replace the images using any of the supported file extensions:

- Static images: {static_extensions:list}.
- Animated images: {animated_extensions:list}.
    * For best animation performance and storage efficiency, use `.avif` format.
    * Animated images are supported only in `LauncherFrame` and its subfolders for now.
"""
loc = """
런처 GUI 테마를 선택합니다.

> `Default` 테마는 **런처 업데이트 시 덮어쓰여집니다**! 테마를 사용자 지정하려면 먼저 복사본을 만드세요.

사용자 지정 테마를 만드는 방법:

1. `Themes` 폴더 안에 있는 `Default` 폴더를 복제합니다.
2. 복제한 폴더의 이름을 이곳에 표시할 이름으로 변경합니다.
3. 지원되는 파일 확장자를 사용하여 이미지를 편집하거나 교체합니다.

- 정적 이미지: {static_extensions:list}.
- 애니메이션 이미지: {animated_extensions:list}.
    * 최상의 애니메이션 성능과 효율적인 저장 공간 활용을 위해 `.avif` 형식을 사용하세요.
    * 현재 애니메이션 이미지는 `LauncherFrame` 및 해당 하위 폴더에서만 지원됩니다.
"""

