If game takes longer to start, adjust **{game_process_wait_timeout_label}** in **General Settings**.
"""
loc = """
게임 프로세스 `{process_name}`이(가) **{timeout}**초 이내에 시작되지 않았습니다.

게임 시작에 시간이 더 오래 걸리면 **일반 설정**에서 **{game_process_wait_timeout_label}**을(를) 조정하세요.
"""

