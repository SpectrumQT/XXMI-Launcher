[launcher_settings_theme_option_menu_tooltip]
src = """
Select a launcher GUI theme.

> The `Default` theme will be **overwritten by launcher updates**! Create a copy if you want to customize it.

To create a custom theme:

1. Duplicate the `Default` folder inside the `Themes` folder.
2. Rename the duplicate to the name you want displayed here.
3. Edit or replace the images using any of the supported file extensions:

- Static images: {static_extensions:list}.
- Animated images: {animated_extensions:list}.
    * For best animation performance and storage efficiency, use `.avif` format.
    * Animated images are supported only in `LauncherFrame` and its subfolders for now.
    * To avoid GUI lag caused by image scaling, make sure animated backgrounds have the same resolution as the launcher window.
"""
loc = """
Выберите тему графического интерфейса лаунчера.

> Тема `Default` будет **перезаписана при обновлении лаунчера**! Создайте копию, если хотите настроить её под себя.

Чтобы создать собственную тему:

1. Скопируйте папку `Default` из папки `Themes`.
2. Переименуйте копию в название, которое хотите видеть здесь.
3. Измените или замените изображения, используя любое из поддерживаемых расширений файлов:

- Статические изображения: {static_extensions:list}.
- Анимированные изображения: {animated_extensions:list}.
    * Для оптимизации производительности и занимаемого места, используйте `.avif` анимации.
    * На данный момент анимированные изображения поддерживаются только в `LauncherFrame` и его подпапках.
    * Чтобы избежать замедления графического интерфейса из-за масштабирования изображений, убедитесь, что разрешение анимированных фонов совпадает с разрешением окна лаунчера.
"""

[launcher_settings_verify_ssl_checkbox_tooltip]
src = """
Controls SLL certificate validation for update downloads from GitHub.
> Disable only if you trust your proxy or whatever else that breaks SSL.

* **Enabled**: Enforce SLL validation to keep you secure.
* **Disabled**: Allow insecure connection that exposes traffic to man-in-middle.
"""
loc = """
Управляет проверкой SSL-сертификатов при загрузке обновлений с GitHub.
> Отключайте проверку только в том случае, если доверяете своему прокси или другому решению, нарушающему работу SSL.

* **Включено**: Проверка SSL-сертификатов обязательна для обеспечения безопасности.
* **Отключено**: Разрешено небезопасное соединение, при котором трафик теряет анонимность.
"""
