[launcher_frame_animation_info_tooltip]
src = """
Displays animated background FPS information.

* `Render`: FPS of GUI drawing engine.
    - Affected by the launcher window size.
* `Decoder`: FPS of video decoding stream.
    - Affected by the source video resolution and format.
    - Capped at `60`, since GUI render can't go faster on modern CPUs.
* `Source`: FPS of the video file itself.
"""
loc = """
Отображает информацию о FPS анимированного фона.

* `Render`: FPS отрисовки графического интерфейса.
    - Зависит от размера окна лаунчера.
* `Decoder`: FPS декодирования видеопотока.
    - Зависит от разрешения и формата исходного видео.
    - Ограничен значением `60`, поскольку на современных процессорах отрисовка GUI не может работать быстрее.
* `Source`: FPS самого видеофайла.
"""

