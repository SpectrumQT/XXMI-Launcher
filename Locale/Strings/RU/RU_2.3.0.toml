src = "XXMI DLL Injection Mode"
loc = "Режим внедрения XXMI DLL"

[advanced_settings_custom_launch_inject_mode_option_menu_tooltip]
src = """
Defines the way of **XXMI DLL** injection into the game process.

* **{general_settings_inject_mode_direct}:** Use `WriteProcessMemory`, more reliable but requires direct memory access.
* **{general_settings_inject_mode_hook}:** Use `SetWindowsHookEx`, less reliable, but potentially less prominent for anti-cheats.
* **{general_settings_inject_mode_skip}:** Skip **XXMI DLL** injection.
"""
loc = """
Определяет способ внедрения **XXMI DLL** в процесс игры.

* **{general_settings_inject_mode_direct}:** Использовать `WriteProcessMemory` — надёжнее, но требует прямого доступа к памяти.
* **{general_settings_inject_mode_hook}:** Использовать `SetWindowsHookEx` — менее надёжно, но потенциально менее заметно для античит-систем.
* **{general_settings_inject_mode_skip}:** Пропустить внедрение  **XXMI DLL**.
"""

