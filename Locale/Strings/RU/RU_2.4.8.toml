[error_migoto_game_detection_timeout]
src = """
Game process `{process_name}` did not start within **{start_timeout}**s.

If game window takes longer to appear, adjust **{game_process_wait_timeout_label}** in **General Settings**.

If game crashed, try to follow the [Crash Isolation Checklist]({checklist_link}).
"""
loc = """
Игровой процесс `{process_name}` не запустился в течение **{start_timeout}** с.

Если окно игры появляется с большей задержкой, увеличьте **{game_process_wait_timeout_label}** в разделе **Общие настройки**.

Если игра вылетела, попробуйте выполнить шаги из [Crash Isolation Checklist]({checklist_link}).
"""

