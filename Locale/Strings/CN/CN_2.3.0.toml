* **{general_settings_launch_steam}:** 通过 Steam 启动游戏，以启用 Steam Overlay 和游戏时间统计。
* **{general_settings_launch_epic}:** 通过 Epic Games 启动游戏，以启用 Epic Games Overlay 和游戏时间统计。
* **{general_settings_launch_custom}:** 运行自定义 Windows 命令来启动游戏。
* **{general_settings_launch_manual}:** 等待您手动启动游戏。
"""

