[error_no_resource_tier_detected]
src = """
Cannot find any resource tier available for configured {game_name} installation:

```
{game_path}
```

Please repair {game_name} with official launcher.
"""
loc = """
找不到当前配置的 {game_name} 安装中可用的资源等级：

```
{game_path}
```

请使用官方启动器修复 {game_name}。
"""

[message_text_resource_tier_selection]
src = """
**{game}** requires **[Resource Quality]({page_link})** to be selected.

{radio_widget}

Selected tier must be **actually installed**, otherwise the game will crash on loading.

You can change it later with **{general_settings_wuwa_resource_tier_label}** in **General Settings**.
"""
loc = """
**{game}** 需要选择 **[资源质量]({page_link})**。

{radio_widget}

所选等级必须**已实际安装**，否则游戏将在加载时崩溃。

之后可以在**常规设置**中通过 **{general_settings_wuwa_resource_tier_label}** 修改此选项。
"""

[general_settings_skip_platform_game_launcher_checkbox_tooltip]
src = """
Make **{platform}** to launch **{game}** process directly, avoiding **{launcher}** launcher.

Requires **{general_settings_configure_platform_launch_options_checkbox}** to be enabled.
"""
loc = """
让 **{platform}** 直接启动 **{game}** 进程，跳过 **{launcher}** 启动器。

需要先启用 **{general_settings_configure_platform_launch_options_checkbox}**。
"""

[general_settings_wuwa_resource_tier_tooltip]
src = """
Controls **[assets quality tier]({page_link})** used by **{game}**.

Make sure that selected tier is **actually installed**.

Selection of non-installed tier will cause the game to crash on loading.
"""
loc = """
控制 **{game}** 使用的**[资源质量等级]({page_link})**。

请确保所选等级**已实际安装**。

选择未安装的等级会导致游戏在加载时崩溃。
"""
