[advanced_settings_custom_launch_inject_mode_option_menu_tooltip]
src = """
Defines the way of **XXMI DLL** injection into the game process.

* **{general_settings_inject_mode_direct}:** Use `WriteProcessMemory`, more reliable but requires direct memory access.
* **{general_settings_inject_mode_hook}:** Use `SetWindowsHookEx`, less reliable, but potentially less prominent for anti-cheats.
* **{general_settings_inject_mode_skip}:** Skip **XXMI DLL** injection.
"""
loc = """
Określa sposób wstrzykiwania **biblioteki DLL XXMI** do procesu gry.

* **{general_settings_inject_mode_direct}:** Używa `WriteProcessMemory`, jest bardziej niezawodny, ale wymaga bezpośredniego dostępu do pamięci.
* **{general_settings_inject_mode_hook}:** Używa `SetWindowsHookEx`, jest mniej niezawodny, ale potencjalnie mniej widoczny dla systemów anty-cheat.
* **{general_settings_inject_mode_skip}:** Pomija wstrzykiwanie **biblioteki DLL XXMI**.
"""

