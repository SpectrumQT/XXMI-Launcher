[general_settings_game_launch_tooltip]
src = """
Choose what the **{launcher_start_button}** button does.

* **{general_settings_launch_direct}:** Launch the game directly from the detected or configured game folder.
* **{general_settings_launch_steam}:** Launch the game through Steam to enable Steam Overlay and playtime tracking.
* **{general_settings_launch_epic}:** Launch the game through Epic Games to enable Epic Games overlay and tracking.
* **{general_settings_launch_custom}:** Run a custom Windows command to launch the game.
* **{general_settings_launch_manual}:** Wait for you to launch the game manually.
"""
loc = """
Wybierz działanie przycisku **{launcher_start_button}**.

* **{general_settings_launch_direct}:** Uruchamia grę bezpośrednio z wykrytego lub skonfigurowanego folderu gry.
* **{general_settings_launch_steam}:** Uruchamia grę przez Steam, aby włączyć nakładkę Steam i śledzenie czasu gry.
* **{general_settings_launch_epic}:** Uruchamia grę przez Epic Games, aby włączyć nakładkę Epic Games i śledzenie czasu gry.
* **{general_settings_launch_custom}:** Uruchamia własne polecenie systemu Windows w celu uruchomienia gry.
* **{general_settings_launch_manual}:** Oczekuje na ręczne uruchomienie gry.
"""

