Launcher uległ awarii podczas inicjalizacji:

{error_text}

Plik dziennika: {log_path}
"""

[log_file_link]
src = "Log file: {log_path}"
loc = "Plik dziennika: {log_path}"

[error_game_exe_duplicates_found]
src = "Found {copies_count} copies of game executable {exe_name}"
loc = "Znaleziono {copies_count} kopie pliku wykonywalnego gry {exe_name}"

[message_text_game_detected_single]
src = """
Please confirm that this is the correct **{general_settings_game_folder_label}**:
```
{game_folder}
```
Alternatively, set it manually in **General Settings**.
"""
loc = """
Potwierdź, że jest to właściwy **{general_settings_game_folder_label}**:
```
{game_folder}
```
Alternatywnie ustaw go ręcznie w **Ustawieniach ogólnych**.
"""

[detected_installation]
src = "Detected installation"
loc = "Wykryto instalację"

[error_wrong_extension]
src = """
Unexpected extension `{actual_extension}` (expected: {expected_extensions:or_list}) for file:
```
{path}
```
"""
loc = """
Nieoczekiwane rozszerzenie `{actual_extension}` (oczekiwano: {expected_extensions:or_list}) dla pliku:
```
{path}
```
