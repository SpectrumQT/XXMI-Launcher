[launcher_frame_animation_info_tooltip]
src = """
Displays animated background FPS information.

* `Render`: FPS of GUI drawing engine.
    - Affected by the launcher window size.
* `Decoder`: FPS of video decoding stream.
    - Affected by the source video resolution and format.
    - Capped at `60`, since GUI render can't go faster on modern CPUs.
* `Source`: FPS of the video file itself.
"""
loc = """
Wyświetla informacje o FPS animowanego tła.

* `Render`: FPS silnika renderującego interfejs graficzny.
    - Zależy od rozmiaru okna launchera.
* `Decoder`: FPS dekodowania strumienia wideo.
    - Zależy od rozdzielczości i formatu źródłowego pliku wideo.
    - Ograniczone do `60`, ponieważ na nowoczesnych procesorach renderowanie interfejsu graficznego nie może działać szybciej.
* `Source`: FPS samego pliku wideo.
"""

